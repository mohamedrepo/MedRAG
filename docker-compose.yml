services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: medrag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://medrag:${POSTGRES_PASSWORD:-change-me}@db:5432/medrag
      SECRET_KEY: ${SECRET_KEY:-change-me}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-medrag-admin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: python -m app.cli serve --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
